# ===========================================================================
# CareerForge AI — local development stack
#
# There is deliberately NO MongoDB container: MongoDB Atlas is the primary
# database (blueprint §7). Supply MONGODB_URI in .env.
#
# Mode 1 — everything in Docker:
#     docker compose --profile app up --build
#
# Mode 2 — infrastructure in Docker, services run locally from your IDE/Maven:
#     docker compose up -d
#   then export CONFIG_IMPORT=optional:configserver:http://localhost:8888 etc.
#   See README.md → "Development modes".
# ===========================================================================

name: careerforge

x-service-base: &service-base
  restart: unless-stopped
  env_file: [.env]
  networks: [careerforge]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  CONFIG_IMPORT: optional:configserver:http://config-server:8888
  EUREKA_SERVER_URI: http://discovery-server:8761/eureka/
  REDIS_HOST: redis
  REDIS_PORT: 6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:

  # ---------------------------------------------------------------- infra --
  redis:
    image: redis:7.4-alpine
    container_name: careerforge-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    networks: [careerforge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: careerforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes: [minio-data:/data]
    networks: [careerforge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the private bucket once, then exits. The bucket is NEVER made public.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: careerforge-minio-init
    depends_on:
      minio: { condition: service_healthy }
    networks: [careerforge]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'bucket ready (private)';
      "
    env_file: [.env]

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: careerforge-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [careerforge]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: careerforge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3001:3000"]
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [careerforge]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.0
    container_name: careerforge-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [careerforge]
    restart: unless-stopped

  # ------------------------------------------------------------- platform --
  config-server:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-config-server
    build:
      context: .
      dockerfile: services/config-server/Dockerfile
    environment:
      <<: *service-env
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./infrastructure/config-repo:/config-repo:ro
    ports: ["8888:8888"]

  discovery-server:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-discovery
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    environment:
      <<: *service-env
      EUREKA_HOSTNAME: discovery-server
    ports: ["8761:8761"]

  api-gateway:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-gateway
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      <<: *service-env
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  # ------------------------------------------------------------- business --
  auth-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-auth
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8081"]
    depends_on:
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  profile-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-profile
    build: { context: ., dockerfile: services/profile-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8082"]
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  jd-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-jd
    build: { context: ., dockerfile: services/jd-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8083"]
    depends_on:
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  resume-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-resume
    build: { context: ., dockerfile: services/resume-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8084"]
    depends_on:
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  ai-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-ai
    build: { context: ., dockerfile: services/ai-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8085"]
    depends_on:
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  assessment-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-assessment
    build: { context: ., dockerfile: services/assessment-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8086"]
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  document-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-document
    build: { context: ., dockerfile: services/document-service/Dockerfile }
    environment:
      <<: *service-env
      S3_ENDPOINT: http://minio:9000
    expose: ["8087"]
    depends_on:
      minio: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  application-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-application
    build: { context: ., dockerfile: services/application-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8088"]
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  notification-service:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-notification
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *service-env
    expose: ["8089"]
    depends_on:
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  # ------------------------------------------------------------- frontend --
  frontend:
    <<: *service-base
    profiles: [app]
    container_name: careerforge-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports: ["5173:8080"]
    depends_on: [api-gateway]

networks:
  careerforge:
    driver: bridge

volumes:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
