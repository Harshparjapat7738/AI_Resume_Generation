server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: profile-service
  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DB_PROFILE}
      auto-index-creation: false   # indexes are created explicitly at startup; see docs/DATABASE.md
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}

# ---------------------------------------------------------------------------
# "My Templates" file storage (ADR-034). The API key is supplied via S3_ACCESS_KEY/
# S3_SECRET_KEY and exists in this process only — never logged, never returned to a client,
# never reaches the frontend (no public file URL is ever issued; every download goes through
# TemplateController's own ownership-checked streaming endpoint). Same MinIO/S3 bucket and
# Compose service the now-deleted document-service used to use — see docker-compose.yml.
# ---------------------------------------------------------------------------
careerforge:
  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
