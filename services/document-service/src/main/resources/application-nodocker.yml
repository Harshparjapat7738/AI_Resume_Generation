# ---------------------------------------------------------------------------
# Profile: nodocker — LOCAL DEVELOPMENT ONLY.
#
# Rendering itself (Thymeleaf + openhtmltopdf) needs no infrastructure and works
# unmodified. Object storage does not: MinIO isn't running unless you also brought up
# `docker compose up -d minio minio-init` (or point S3_ENDPOINT at a real S3 bucket).
# Without it, rendering will fail at the upload step with DOCUMENT_RENDER_FAILED — the
# service still starts and reports health normally.
#
# Do not activate this profile outside a developer machine.
# ---------------------------------------------------------------------------

logging:
  level:
    ai.careerforge: DEBUG
