server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # `include` (not `active`): the native backend requires the "native" profile to be
    # active no matter what — but `active` set here is fully replaced (not merged) by an
    # externally-supplied SPRING_PROFILES_ACTIVE (e.g. docker-compose's shared
    # x-service-env sets it to "docker" for every service), which would silently disable
    # the native backend and fall through to Spring Cloud Config Server's git default —
    # exactly the "you need to configure a uri for the git repository" failure ADR-011
    # exists to avoid. `include` is additive from every source, so "native" stays active
    # regardless of what else is set.
    include: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./infrastructure/config-repo}
        # Fail fast rather than silently serving empty configuration.
        fail-on-composite-error: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
