# ---------------------------------------------------------------------------
# Profile: nodocker — LOCAL DEVELOPMENT ONLY.
#
# This service carries a Redis starter for caching / job streams. Redis is not
# running in the no-Docker setup, so its health indicator is disabled to keep
# /actuator/health reporting UP. No functional behaviour changes.
#
# Do not activate this profile outside a developer machine.
# ---------------------------------------------------------------------------

management:
  health:
    redis:
      enabled: false

logging:
  level:
    ai.careerforge: DEBUG
