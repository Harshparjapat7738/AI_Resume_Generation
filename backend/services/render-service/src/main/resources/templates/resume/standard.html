<!--
  STANDARD resume layout (ADR-036). Every dynamic value below uses th:text (escaped output,
  never th:utext) — candidate-supplied text is always emitted as inert, entity-escaped text,
  never live markup. Every ${...} expression is self-contained (literals and concatenation
  live inside the same OGNL expression, never split across th:text and plain body text) to
  keep the syntax uniform and unambiguous. Structure only; page fitting, fonts and the
  strict-XHTML pass are later steps (jsoup/W3CDom, Open HTML to PDF).
-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${header.fullName() + ' — Resume'}">Resume</title>
  <!--
    Typography/color here is purely presentational — every rule below is either a font
    stack (base-14 PDF standard fonts only; nothing here needs an embedded font file) or a
    color/spacing choice. None of it changes what text exists or its reading order, so it
    carries no ATS-parsing risk: a parser that strips all styling and linearizes the page
    sees exactly the same words in exactly the same order either way.

    Pagination: without `page-break-inside`/`page-break-after` below, a page break can fall
    between one entry's title/meta line and its own bullets (or right after a lone section
    heading), which reads as content going missing rather than a normal page turn. Both are
    a preference, not a hard constraint — a genuinely long entry that can't fit on one page
    at all still flows across pages rather than being forced to overflow.
  -->
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 10pt;
      line-height: 1.4;
      color: #1f1f1f;
    }
    .document-header h1 {
      font-size: 20pt;
      letter-spacing: 0.5px;
      margin: 0 0 2pt;
    }
    .contact {
      color: #444;
      margin: 0 0 4pt;
    }
    .links {
      list-style: none;
      padding: 0;
      margin: 0 0 10pt;
    }
    .links li {
      display: inline;
      margin-right: 10pt;
    }
    .resume-section h2 {
      font-size: 11pt;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #2c4a6b;
      border-bottom: 1pt solid #2c4a6b;
      padding-bottom: 2pt;
      margin: 12pt 0 6pt;
      page-break-after: avoid;
    }
    .entry {
      margin-bottom: 8pt;
      page-break-inside: avoid;
    }
    .entry h3 {
      font-size: 10.5pt;
      margin: 0;
      display: inline;
    }
    .entry-meta {
      color: #444;
      margin: 1pt 0 3pt;
    }
    .entry-meta span:first-child {
      color: #2c4a6b;
      font-weight: bold;
    }
    .bullets {
      margin: 0;
      padding-left: 14pt;
    }
    .bullets li {
      margin-bottom: 2pt;
    }
  </style>
</head>
<body>
  <header class="document-header">
    <h1 th:text="${header.fullName()}">Full Name</h1>
    <p class="contact">
      <span th:text="${header.email()}">email@example.com</span>
      <span th:if="${header.phone() != null}" th:text="${' · ' + header.phone()}"> · phone</span>
      <span th:if="${header.location() != null}" th:text="${' · ' + header.location()}"> · location</span>
    </p>
    <ul class="links" th:if="${!header.links().isEmpty()}">
      <li th:each="link : ${header.links()}">
        <a th:href="${link.url()}" th:text="${link.label()}">Link</a>
      </li>
    </ul>
  </header>

  <section class="summary" th:if="${summary != null}">
    <p th:text="${summary.text()}">Professional summary.</p>
  </section>

  <section class="resume-section" th:each="section : ${sections}">
    <h2 th:text="${section.heading().atsLabel()}">Section</h2>

    <article class="entry" th:each="entry : ${section.entries()}">
      <h3 th:text="${entry.title()}">Title</h3>
      <p class="entry-meta">
        <span th:if="${entry.organisation() != null}" th:text="${entry.organisation()}">Organisation</span>
        <span th:if="${entry.location() != null}" th:text="${' — ' + entry.location()}"> — Location</span>
        <span th:if="${entry.startDate() != null}"
              th:text="${' (' + entry.startDate() + ' – ' + (entry.endDate() != null ? entry.endDate() : 'Present') + ')'}">
           (dates)
        </span>
      </p>
      <ul class="bullets" th:if="${!entry.bullets().isEmpty()}">
        <li th:each="bullet : ${entry.bullets()}" th:text="${bullet.text()}">Bullet</li>
      </ul>
    </article>
  </section>
</body>
</html>
